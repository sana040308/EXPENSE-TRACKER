<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1> Expense Tracker </h1>
    <section>
        <h2>Financial Summary</h2>
      <div id="summary-cards" >
         <div class="summary-card">
            <h3>Total Income</h3>
            <p>₹0</p>
        </div>
        <div class="summary-card">
            <h3>Total Expense</h3>
            <p>₹0</p>
        </div>
        <div class="summary-card">
            <h3>Balance</h3>
            <p>₹0</p>
        </div>
      </div>
    </section>
    <section>
        <h2>Add Transaction</h2>
       <form id="transaction-form">
         <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="e.g. Lunch" required>
        </div>
        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="e.g. 100.00" step="0.01" min="0.01" required>
        </div>
        <div class="form-group">
            <label for="type">Transaction Type</label>
            <select id="type" required>
                <option value="" disabled selected>Choose Transaction Type</option>
                <option value="Income">Income</option>
                <option value="Expense">Expense</option>
            </select>
        </div>
       <div class="form-group">  
        <label for="category">Category</label>
        <select id="category" required>
            <option value="" disabled selected>Choose Category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport </option>
            <option value="Shopping">Shopping</option>
            <option value="Education">Education</option>
            <option value="Others">Others</option>
        </select>
        </div>
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
        </div>
        <div>
            <button type="submit">Add Transaction</button>
        </div>
        </form>
    </section>
 <section>
    <h2>Transaction History</h2>
    <ul id="transaction-list"></ul>
   </section>
    <script src="script.js"></script>
</body>

</html>
